name: Android APK Build

# Builds a debug APK of TenetBid (Capacitor wrapper) on every push to main.
# Download the APK from the run's "Artifacts" section and sideload it:
#   Settings > Security > allow "Install unknown apps", then open the APK.
# For Play Store distribution, switch to a signed AAB (release) build.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenetbid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
