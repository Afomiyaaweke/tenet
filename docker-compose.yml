# ──────────────────────────────────────────────────────────────
# TenetBid — Docker Compose (Production)
# ──────────────────────────────────────────────────────────────
# Usage:
#   Build & start:   docker compose up --build -d
#   Seed DB:         docker compose exec app bun run db:seed
#   View logs:       docker compose logs -f app
#   Stop:            docker compose down
# ──────────────────────────────────────────────────────────────
#
# IMPORTANT: TenetBid is a Node.js SERVER application (Next.js).
# It requires a running Node.js process — do NOT deploy as a static site.
# If your platform auto-generates a Dockerfile for static sites,
# switch the deployment type to "Docker" or "Node.js" instead.
# ──────────────────────────────────────────────────────────────

services:
  # ─── Next.js Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenetbid-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET must be set}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?ERROR: NEXTAUTH_SECRET must be set}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SUPPORT_EMAIL=support@tenetbid.com
    volumes:
      - tenetbid-db:/app/db
      - tenetbid-uploads:/app/uploads
    networks:
      - tenetbid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Chat WebSocket Service ───
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: tenetbid-chat
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    networks:
      - tenetbid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ─── Named Volumes ───
volumes:
  tenetbid-db:
    driver: local
  tenetbid-uploads:
    driver: local

# ─── Network ───
networks:
  tenetbid-network:
    driver: bridge
