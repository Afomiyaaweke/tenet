# ──────────────────────────────────────────────────────────────
# Tenets Tender Ecosystem — Docker Compose
# ──────────────────────────────────────────────────────────────
# Usage:
#   Development:   docker compose up --build
#   Production:    docker compose -f docker-compose.yml up --build -d
#   Seed DB:       docker compose exec app bun run db:seed
#   View logs:     docker compose logs -f app
#   Stop:          docker compose down
# ──────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: tenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenet}
      POSTGRES_USER: ${POSTGRES_USER:-tenet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}
    volumes:
      - tenet-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenet-network

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: tenet-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - tenet-redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenet-network

  # ─── Next.js Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenet-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tenet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tenet}?schema=public&connection_limit=20
      - JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NODE_ENV=production
    volumes:
      - tenet-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - tenet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Chat WebSocket Service ───
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: tenet-chat
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    networks:
      - tenet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Caddy Reverse Proxy (Gateway) ───
  caddy:
    image: caddy:2-alpine
    container_name: tenet-gateway
    restart: unless-stopped
    ports:
      - "81:81"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - tenet-network

# ─── Named Volumes ───
volumes:
  tenet-pgdata:
    driver: local
  tenet-redisdata:
    driver: local
  tenet-uploads:
    driver: local

# ─── Network ───
networks:
  tenet-network:
    driver: bridge
